name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/petsapp_ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { spawnSync } from 'node:child_process';
          const url = new URL(process.env.TEST_DATABASE_URL);
          const name = url.pathname.slice(1);
          if (!/^petsapp_ci_[0-9_]+$/.test(name) || name.length > 63) throw new Error('Invalid CI test database name');
          url.pathname = '/postgres';
          const admin = new pg.Client({ connectionString: url.toString() });
          await admin.connect();
          let created = false;
          let status = 1;
          try {
            await admin.query('CREATE DATABASE "' + name + '"');
            created = true;
            status = spawnSync('npx', ['vitest', 'run', '--maxWorkers=2'], { stdio: 'inherit', env: process.env }).status ?? 1;
          } finally {
            try {
              if (created) await admin.query('DROP DATABASE "' + name + '" WITH (FORCE)');
            } catch {
              console.error('Failed to clean the owned CI test anchor');
              if (status === 0) status = 1;
            } finally {
              await admin.end();
            }
            process.exitCode = status;
          }
          NODE
      - name: E2E tests
        run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        env:
          NEXT_PUBLIC_PETSAPP_API_URL: http://localhost:3001
        run: npm run build
